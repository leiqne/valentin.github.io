<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quisieras ser mi San Valentín?</title>
    <link rel="stylesheet" href="valentin.css">
</head>
<body>
    <div class="container">
        <h1>Hola mi amooooor, ¿Quisieras ser mi San Valentín?</h1>
        <div class="buttons">
            <button id="siBtn">¡Sí!</button>
            <button id="noBtn">No</button>
        </div>
        <div id="mensaje" class="hidden">
            <p>¡Gracias por ser mi San Valentín, mi vida! Eres la persona más especial en mi vida. Te amo muuuuuucho. 💖</p>
        </div>
    </div>

    <!-- Flores decorativas -->
    <div class="flower flower-1">🌸</div>
    <div class="flower flower-2">🌹</div>
    <div class="flower flower-3">💮</div>
    <div class="flower flower-4">🌼</div>
    <div class="flower flower-5">🌺</div>
    <div class="flower flower-6">🌻</div>
    <div class="flower flower-7">🌷</div>

    <script src="valentin.js"></script>
</body>
</html>
